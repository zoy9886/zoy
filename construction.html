<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>豐譽｜施工現場 RPG 測試</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#172d38;color:white;font-family:system-ui}main{height:100dvh;display:flex;align-items:center;flex-direction:column}header{height:44px;display:flex;align-items:center;font-size:13px}#stage{position:relative;flex:1;min-height:0;aspect-ratio:9/16;max-width:100vw;background:#93b1b2}canvas{width:100%;height:100%;image-rendering:pixelated;touch-action:none}#hud{position:absolute;top:8px;left:8px;background:#173743d9;padding:8px;border-radius:6px;font-size:11px}#pad{position:absolute;bottom:14px;left:12px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}button{background:#234b60e8;color:white;border:2px solid #e4e5d0;border-radius:10px;height:48px;font-size:21px;touch-action:none}#act{position:absolute;bottom:38px;right:15px;width:72px;height:72px;border-radius:50%;background:#b47b39;font-size:16px}#quest{position:absolute;top:57px;right:8px;background:#173743e8;padding:8px;border-radius:7px;font-size:11px;max-width:145px}#task{display:none;position:absolute;inset:0;background:#0d222ac9;align-items:center;justify-content:center;padding:15px;z-index:20}#task .panel{width:100%;max-height:78%;overflow:auto;background:#e8e8d6;color:#24414b;border:4px solid #537782;border-radius:13px;padding:17px;box-shadow:0 10px 0 #122e38}#task button{display:block;width:100%;height:auto;min-height:43px;font-size:13px;margin:9px 0;padding:9px;text-align:left;background:#416a78;color:#fff}#task h2{font-size:19px}#task p{font-size:14px;line-height:1.65}#toast{position:absolute;bottom:165px;left:10px;right:10px;background:#183846ee;border:2px solid #e1e4c7;padding:10px;display:none;font-size:13px}a{color:#dceac2}</style></head><body><main><header>施工現場｜手機直式 RPG 可玩測試版</header><div id="stage"><canvas id="game" width="360" height="640"></canvas><div id="hud">方向鍵／WASD 移動 · 鏡頭跟隨 · 物件碰撞<br><a href="./">返回原版遊戲</a></div><div id="toast"></div><div id="quest">🏗️ 施工組任務<br>尋找施工學長 · 尚未完成</div><div id="task"><div class="panel"><div id="taskBody"></div></div></div><div id="pad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div><button id="act">互動</button></div></main><script>
const c=document.querySelector('#game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const T=32,W=24*T,H=36*T;const held=new Set(),player={x:W/2,y:H-120,dir:'up',step:0};const objects=[];const npc={x:370,y:347,name:'施工學長'};let order=[],completed=false,score=0,taskOpen=false;const steps=['確認圖說與作業條件','檢查作業區及安全措施','確認材料、人員與機具','依核定計畫施工及檢查'];try{let saved=JSON.parse(localStorage.getItem('fengyu_build_v2')||'{}');completed=!!saved.completed;score=saved.score||0}catch(e){}function obj(type,x,y,w,h,solid=true){objects.push({type,x,y,w,h,solid})}function build(){obj('office',35,85,245,165);obj('scaffold',380,70,300,205);obj('crane',615,265,95,200);obj('storage',25,375,190,140);obj('forklift',480,410,90,95);obj('excavator',455,720,165,115);obj('storage',30,760,170,115);obj('barrier',240,500,115,20);obj('barrier',420,585,125,20);for(let i=0;i<9;i++){obj('cone',55+i%3*44,590+Math.floor(i/3)*40,14,17,false)}obj('sign',65,930,75,70);obj('tree',670,930,70,95);obj('tree',30,1010,60,80);obj('gate',210,1065,340,25,false)}build();function rnd(x,y){let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}function label(t,x,y,size=12,color='#24444b'){g.fillStyle=color;g.font='bold '+size+'px system-ui';g.textAlign='center';g.fillText(t,x,y)}function drawObj(o){let {x,y,w,h,type}=o;rect(x+5,y+9,w,h,'#334d5740');if(type==='office'){rect(x,y,w,h,'#b5c5c4');rect(x+8,y+8,w-16,h-20,'#e0e6dd');rect(x,y,w,24,'#4b7483');rect(x+16,y+45,60,47,'#78a4b3');rect(x+90,y+45,60,47,'#78a4b3');rect(x+166,y+42,54,90,'#6d929a');label('工地事務所',x+w/2,y+19,15,'#fff')}else if(type==='scaffold'){rect(x,y,w,h,'#a9b5ad');for(let xx=x+8;xx<x+w;xx+=30)rect(xx,y,5,h,'#d17c43');for(let yy=y+16;yy<y+h;yy+=34)rect(x,yy,w,5,'#c7d2cd');rect(x+20,y+22,w-40,h-42,'#6d99b755');label('結構施工區',x+w/2,y+h/2,16)}else if(type==='crane'){rect(x+38,y,16,h,'#e6b44e');for(let yy=y+8;yy<y+h;yy+=22){rect(x+32,yy,30,5,'#bc8035')}rect(x,y+22,w,15,'#d89a42')}else if(type==='storage'){rect(x,y,w,h,'#69828a');rect(x+6,y+6,w-12,h-12,'#c2b39a');for(let xx=x+13;xx<x+w-20;xx+=34)for(let yy=y+15;yy<y+h-20;yy+=30){rect(xx,yy,28,21,'#94765d');rect(xx+2,yy+2,23,4,'#d7b48c')}label('材料區',x+w/2,y-6)}else if(type==='forklift'){rect(x+9,y+10,w-18,h-20,'#d5a44e');rect(x+24,y+13,35,40,'#41606b');rect(x,y+20,10,60,'#333f42');rect(x+w-9,y+10,8,75,'#333f42');label('堆高機',x+w/2,y-5)}else if(type==='excavator'){rect(x+5,y+38,w-10,55,'#3b4d54');rect(x+20,y+15,80,70,'#d5a14b');rect(x+40,y+20,35,34,'#6a9caa');rect(x+92,y+28,60,11,'#d5a14b');rect(x+145,y+20,18,48,'#b67e38');label('挖土機',x+w/2,y-7)}else if(type==='barrier'){rect(x,y,w,h,'#f0bd64');for(let i=0;i<w;i+=24)rect(x+i,y,12,h,'#394e52')}else if(type==='cone'){rect(x+4,y,6,h-4,'#e98e4d');rect(x,y+h-5,w,5,'#4a5a58');rect(x+2,y+9,w-4,3,'#fff4d7')}else if(type==='sign'){rect(x,y,w,h,'#e6e7d5');rect(x+4,y+4,w-8,h-8,'#eff3eb');label('施工',x+w/2,y+26,17);label('安全第一',x+w/2,y+48,12)}else if(type==='tree'){rect(x+w/2-5,y+h/2,10,h/2,'#77634e');for(let i=0;i<6;i++){rect(x+7+(i%3)*19,y+(Math.floor(i/3))*21,25,31,i%2?'#568c74':'#427b68')}}else if(type==='gate'){rect(x,y,w,8,'#3d555c');for(let xx=x;xx<x+w;xx+=24)rect(xx,y,5,25,'#596f76')}}function blocked(x,y){const r={x:x-9,y:y+7,w:18,h:13};if(r.x<4||r.y<4||r.x+r.w>W-4||r.y+r.h>H-4)return true;return objects.some(o=>o.solid&&r.x<o.x+o.w&&r.x+r.w>o.x&&r.y<o.y+o.h&&r.y+r.h>o.y)}function drawNPC(){let x=npc.x,y=npc.y;rect(x-12,y+10,24,6,'#29434c44');rect(x-9,y+1,8,14,'#394e68');rect(x+2,y+1,8,14,'#394e68');rect(x-12,y-16,24,19,'#648c85');rect(x-16,y-11,5,16,'#d9a17c');rect(x+11,y-11,5,16,'#d9a17c');rect(x-9,y-31,18,17,'#d9a17c');rect(x-12,y-36,24,9,'#f5c45c');rect(x-8,y-40,16,7,'#f8d274');rect(x-5,y-23,3,3,'#34444d');rect(x+3,y-23,3,3,'#34444d');rect(x-2,y-11,4,12,'#f2db9b');label(npc.name,x,y-49,13,'#173d4b');label(completed?'✓':'!',x,y-65,19,completed?'#397a57':'#b57828')}function character(){let x=player.x,y=player.y;rect(x-11,y+11,23,6,'#304e5655');rect(x-7,y+6,6,12,'#344f60');rect(x+2,y+6,6,12,'#344f60');rect(x-10,y-12,20,21,'#e7b45a');rect(x-14,y-10,5,17,'#e3ac80');rect(x+9,y-10,5,17,'#e3ac80');rect(x-8,y-27,16,16,'#e3ac80');rect(x-11,y-31,22,7,'#f2c24e');rect(x-7,y-35,14,7,'#f2c24e');rect(x-4,y-6,8,10,'#f7e6aa');if(player.dir==='down'){rect(x-5,y-20,3,3,'#33434a');rect(x+3,y-20,3,3,'#33434a')}else if(player.dir==='up'){rect(x-8,y-26,16,9,'#5e4c40')}}let prev=0;const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function loop(t){let dt=Math.min((t-prev)/1000,.045)||0;prev=t;let dx=0,dy=0;for(const k of (taskOpen?[]:held)if(dirs[k]){dx+=dirs[k][0];dy+=dirs[k][1];player.dir=k}if(dx||dy){let n=Math.hypot(dx,dy),v=125*dt;dx=dx/n*v;dy=dy/n*v;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;player.step+=dt}let cx=Math.max(0,Math.min(W-360,player.x-180)),cy=Math.max(0,Math.min(H-640,player.y-355));rect(0,0,360,640,'#aebcb5');g.save();g.translate(-Math.round(cx),-Math.round(cy));let x0=Math.floor(cx/T),y0=Math.floor(cy/T);for(let y=y0;y<Math.min(36,y0+22);y++)for(let x=x0;x<Math.min(24,x0+13);x++){let v=rnd(x,y);rect(x*T,y*T,T,T,v>.72?'#a3b5af':'#b5c2b9');rect(x*T,y*T,31,1,'#dce1d13a');if(v>.45){rect(x*T+5,y*T+17,4,2,'#7f9995');rect(x*T+22,y*T+26,3,2,'#e2d9c0')}}rect(286,270,190,750,'#a5b7b4');for(let yy=270;yy<1000;yy+=44){rect(295,yy,5,22,'#e9ce83');rect(466,yy,5,22,'#e9ce83')}const things=objects.map(o=>({y:o.y+o.h,o}));things.push({y:player.y+18,p:true});things.push({y:npc.y+17,npc:true});things.sort((a,b)=>a.y-b.y);for(const item of things){if(item.p)character();else if(item.npc)drawNPC();else drawObj(item.o)}g.restore();requestAnimationFrame(loop)}document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held.delete(k))});const alias={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};addEventListener('keydown',e=>{let k=alias[e.key];if(k){held.add(k);e.preventDefault()}});addEventListener('keyup',e=>{let k=alias[e.key];if(k)held.delete(k)});function taskView(){taskOpen=true;held.clear();document.querySelector('#task').style.display='flex';let b=document.querySelector('#taskBody');if(completed){b.innerHTML='<h2>🏅 施工組徽章</h2><p>你已完成施工學長的工序挑戰，得分 '+score+' 分。</p><button id="closeTask">返回工地</button>';document.querySelector('#closeTask').onclick=closeTask;return}if(order.length===4){let right=order.every((v,i)=>v===i);score=right?100:70;completed=true;try{localStorage.setItem('fengyu_build_v2',JSON.stringify({completed,score}))}catch(e){}document.querySelector('#quest').innerHTML='🏅 施工組任務完成<br>工序挑戰 '+score+' 分';b.innerHTML='<h2>🎉 工序挑戰完成</h2><p>'+(right?'順序正確！你掌握了這次施工準備的安排邏輯。':'完成挑戰！建議順序如下：')+'</p><p>'+steps.join(' → ')+'</p><p>得分：'+score+' 分</p><button id="closeTask">返回工地</button>';document.querySelector('#closeTask').onclick=closeTask;return}b.innerHTML='<h2>🏗️ 施工學長｜工序挑戰</h2><p>歡迎來到施工現場！請依合理順序，安排施工準備與執行流程。</p><p><b>已選 '+order.length+'/4：</b>'+(order.map(i=>steps[i]).join(' → ')||'尚未選擇')+'</p><div id="taskChoices"></div><button id="quitTask">暫時離開</button>';for(let i of [2,0,3,1])if(!order.includes(i)){let btn=document.createElement('button');btn.textContent=steps[i];btn.onclick=()=>{order.push(i);taskView()};document.querySelector('#taskChoices').appendChild(btn)}document.querySelector('#quitTask').onclick=closeTask}function closeTask(){taskOpen=false;document.querySelector('#task').style.display='none'}document.querySelector('#act').onclick=()=>{if(taskOpen)return;if(Math.hypot(player.x-npc.x,player.y-npc.y)<110){taskView();return}let o=objects.filter(o=>Math.hypot(player.x-o.x-o.w/2,player.y-o.y-o.h/2)<125).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];let t=document.querySelector('#toast');t.textContent=o?'正在查看：'+({office:'工地事務所',scaffold:'結構施工區',storage:'材料區',forklift:'堆高機',excavator:'挖土機',sign:'安全告示'}[o.type]||o.type)+'。':'請靠近施工學長，按互動開始工序挑戰。';t.style.display='block';setTimeout(()=>t.style.display='none',2300)};if(completed)document.querySelector('#quest').innerHTML='🏅 施工組任務完成<br>工序挑戰 '+score+' 分';requestAnimationFrame(loop);
</script></body></html>
