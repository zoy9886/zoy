</style></head><body><div id="wrap"><header><b>THE FIRST CHAPTER II</b><span id="status">工地冒險日誌 · 原型</span><button id="journal">冒險手冊</button></header><div id="game"><canvas id="screen" width="360" height="640"></canvas><div id="hud"></div><div id="controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><button id="action">互動</button><div id="dialog"><strong id="speaker"></strong><p id="speech"></p><div id="choices"></div></div><div id="modal"><div class="panel" id="panel"></div></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('screen');let ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;const W=640,H=480,T=32;const screenCtx=ctx,worldCanvas=document.createElement('canvas');worldCanvas.width=W;worldCanvas.height=H;const worldCtx=worldCanvas.getContext('2d');worldCtx.imageSmoothingEnabled=false;const VIEW_W=270,VIEW_H=480;let player={x:9.5,y:9.5,dir:'down',walk:0},room='hub',held=new Set(),modal=true,dialog=false,profile={name:'冒險者',hair:'brown',skin:'peach',shirt:'teal',pants:'navy',style:'short'},finished={safety:false,build:false,quality:false,plan:false},scores={safety:0,build:0,quality:0,plan:0},found=new Set(),cat=false,question=0,order=[],planFound=new Set(),last=0;const colors={hair:{brown:'#65412c',black:'#293038',blond:'#d9a35c',pink:'#c278a1'},skin:{peach:'#f3cba4',tan:'#c99067',brown:'#956547',light:'#ffe2c2'},shirt:{teal:'#418d8b',red:'#bd6b62',yellow:'#d9ac57',purple:'#8875a6',white:'#f1e9d5'},pants:{navy:'#344e65',black:'#313c43',khaki:'#ad936a'}};const maps={hub:{name:'實習生集合處',base:'#c4b18c',wall:'#617d72',obstacles:[[2,2,5,4],[14,2,18,4],[2,11,5,13]],npcs:[{x:9,y:5,label:'HR 學姊',type:'hr'},{x:16,y:9,label:'橘貓',type:'cat'}],doors:[{x:0,y:8,to:'safety',tx:17,ty:8,label:'職安巡查區'},{x:19,y:8,to:'build',tx:2,ty:8,label:'施工現場'},{x:9,y:0,to:'plan',tx:9,ty:12,label:'規劃辦公室'},{x:9,y:14,to:'quality',tx:9,ty:2,label:'品管檢驗區'}]},safety:{name:'職安巡查區',base:'#a6b49a',wall:'#6b8a7c',obstacles:[[3,3,7,5],[12,10,16,12]],npcs:[{x:3,y:8,label:'職安學長',type:'safety'}],doors:[{x:19,y:8,to:'hub',tx:2,ty:8,label:'返回據點'}],items:[{x:6,y:8,id:'helmet',label:'安全帽',hint:'作業人員沒有正確配戴安全帽'},{x:11,y:4,id:'edge',label:'臨邊',hint:'臨邊防護措施不足'},{x:13,y:8,id:'path',label:'通道',hint:'材料堆放阻礙通行'}]},build:{name:'施工現場',base:'#b7a68b',wall:'#947d63',obstacles:[[4,3,7,6],[13,9,17,11]],npcs:[{x:14,y:5,label:'施工學長',type:'build'}],doors:[{x:0,y:8,to:'hub',tx:17,ty:8,label:'返回據點'}]},quality:{name:'品管檢驗區',base:'#b6bdba',wall:'#7c9797',obstacles:[[3,4,7,5],[12,4,16,5]],npcs:[{x:9,y:6,label:'品管學姊',type:'quality'}],doors:[{x:9,y:0,to:'hub',tx:9,ty:12,label:'返回據點'}]},plan:{name:'規劃辦公室',base:'#b4b5a0',wall:'#71868b',obstacles:[[3,4,7,5],[12,4,16,5]],npcs:[{x:10,y:6,label:'規劃工程師',type:'plan'}],doors:[{x:9,y:14,to:'hub',tx:9,ty:2,label:'返回據點'}],items:[{x:4,y:8,id:'A',label:'圖面 A',hint:'發現樓梯位置不同'},{x:15,y:8,id:'B',label:'圖面 B',hint:'發現出入口位置不同'},{x:10,y:10,id:'C',label:'圖面 C',hint:'發現柱位標記不同'}]}};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function text(s,x,y,color='#243b3b',size=13){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.fillText(s,x,y)}function char(x,y,p,scale=1,phase=0){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(scale,scale);let bob=Math.sin(phase)*1.4;const sk=colors.skin[p.skin]||p.skin||'#e8bb91',ha=colors.hair[p.hair]||p.hair||'#50352d',sh=colors.shirt[p.shirt]||p.shirt||'#4c91a0',pa=colors.pants[p.pants]||p.pants||'#344e65';rect(-12,15+bob,10,4,'#283d44');rect(2,15-bob,10,4,'#283d44');rect(-10,7+bob,8,10,pa);rect(2,7-bob,8,10,pa);rect(-10,7+bob,2,8,'#ffffff30');rect(8,7-bob,2,8,'#00000025');rect(-12,-8+bob,24,17,sh);rect(-12,-8+bob,24,3,'#ffffff38');rect(8,-4+bob,4,11,'#00000026');rect(-16,-5+bob,5,13,sk);rect(11,-5+bob,5,13,sk);rect(-15,5+bob,4,3,'#d5a17f');rect(12,5+bob,4,3,'#d5a17f');rect(-3,-7+bob,5,11,'#ffffff24');rect(-12,-29,24,26,ha);if(p.style==='long'){rect(-14,-22,5,26,ha);rect(9,-22,5,26,ha)}rect(-10,-27,20,20,sk);rect(-10,-27,3,18,'#ffffff24');rect(7,-25,3,16,'#00000017');rect(-12,-31,24,10,ha);rect(-9,-33,18,4,ha);rect(-8,-31,7,3,'#ffffff35');rect(5,-31,5,3,'#ffffff24');if(p.style==='pony'){rect(10,-25,8,15,ha);rect(15,-14,4,8,ha)}if(p.style==='short')rect(6,-25,6,5,ha);rect(-6,-16,3,3,'#27383b');rect(4,-16,3,3,'#27383b');rect(-6,-16,1,1,'#ffffff');rect(4,-16,1,1,'#ffffff');rect(-7,-10,4,2,'#e9a5a080');rect(5,-10,4,2,'#e9a5a080');rect(-1,-10,3,1,'#a86c61');ctx.restore()}function draw(){let m=maps[room];rect(0,0,W,H,m.base);for(let y=0;y<15;y++)for(let x=0;x<20;x++){rect(x*T+1,y*T+1,30,30,(x+y)%2?'#ffffff0b':'#00000009');if((x*7+y*13)%19===0)rect(x*T+12,y*T+9,3,3,'#ffffff20')}for(let x=0;x<20;x++){rect(x*T,0,T,20,m.wall);rect(x*T,H-20,T,20,m.wall)}for(let y=0;y<15;y++){rect(0,y*T,20,T,m.wall);rect(W-20,y*T,20,T,m.wall)}m.obstacles.forEach(([x1,y1,x2,y2],i)=>{let x=x1*T,y=y1*T,w=(x2-x1)*T,h=(y2-y1)*T;rect(x+5,y+10,w-10,h-12,'#354d4b55');rect(x,y,w-5,h-15,room==='build'?'#c89b63':room==='safety'?'#d8a85e':'#7c9c94');rect(x+6,y+6,w-17,6,'#e6d8ac');for(let j=0;j<Math.floor(w/24);j++)rect(x+10+j*24,y+22,12,9,'#5b7770')});if(room==='hub'){rect(228,190,185,92,'#698f84');rect(245,207,150,12,'#d5c48c');text('WELCOME',320,245,'#f5edcf',18)}if(room==='build'){for(let i=0;i<4;i++){rect(260+i*26,55,20,40,'#c48f53');rect(270+i*26,48,6,8,'#f4d99c')}rect(420,145,10,130,'#d8aa59');rect(370,155,115,8,'#d8aa59');rect(462,163,3,35,'#273c3a')}if(room==='safety'){for(let i=0;i<4;i++){rect(280+i*19,315,13,21,'#e8b658');rect(282+i*19,322,9,5,'#f5ead1')}}if(room==='quality'){for(let i=0;i<4;i++){rect(85+i*90,285,65,30,'#668b91');rect(95+i*90,292,25,12,'#e8e5cb')}}if(room==='plan'){for(let i=0;i<3;i++){rect(115+i*140,255,100,60,'#e5e0c8');rect(125+i*140,265,60,3,'#87a5a2');rect(125+i*140,278,45,3,'#87a5a2')}}m.doors.forEach(d=>{rect(d.x*T+3,d.y*T+3,26,26,'#f1d58e');text('↔',d.x*T+16,d.y*T+23,'#3b5147',19)});(m.items||[]).forEach(it=>{rect(it.x*T+5,it.y*T+4,22,23,room==='safety'?'#cf805b':'#ead6a4');text(found.has(it.id)&&room==='safety'?'✓':'!',it.x*T+16,it.y*T+22,'#213b3c',18)});m.npcs.forEach(n=>{let np={skin:'peach',hair:n.type==='cat'?'brown':'black',shirt:n.type==='hr'?'purple':n.type==='safety'?'yellow':n.type==='quality'?'white':'red',pants:'navy',style:'short'};if(n.type==='cat'){rect(n.x*T+4,n.y*T+10,23,13,'#d98d43');rect(n.x*T+8,n.y*T+3,15,13,'#d98d43');rect(n.x*T+8,n.y*T+1,5,7,'#d98d43');rect(n.x*T+19,n.y*T+1,5,7,'#d98d43')}else char(n.x*T+16,n.y*T+27,np,.75,Math.sin(Date.now()/500)*.5);text(n.label,n.x*T+16,n.y*T-8,'#183637',11)});char(player.x*T,player.y*T+6,profile,1,player.walk);$('hud').innerHTML=`<b>${m.name}</b><br>已完成 ${Object.values(finished).filter(Boolean).length}/4 個組別任務<br>靠近 NPC 或道具按「互動」`;}
function blocked(x,y){if(x<.75||x>19.25||y<.75||y>14.25)return true;return maps[room].obstacles.some(([a,b,c,d])=>x>a-.25&&x<c+.2&&y>b-.45&&y<d+.2)}function update(dt){if(modal||dialog)return;let dx=0,dy=0;if(held.has('left')||held.has('a'))dx--;if(held.has('right')||held.has('d'))dx++;if(held.has('up')||held.has('w'))dy--;if(held.has('down')||held.has('s'))dy++;if(dx||dy){let len=Math.hypot(dx,dy),v=Math.min(dt,.04)*3.2;dx=dx/len*v;dy=dy/len*v;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;player.walk+=dt*13;player.dir=Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up'}maps[room].doors.forEach(d=>{if(Math.hypot(player.x-(d.x+.5),player.y-(d.y+.5))<.9){room=d.to;player.x=d.tx;player.y=d.ty;held.clear();$('status').textContent=maps[room].name}})}function loop(now){let dt=last?(now-last)/1000:0;last=now;update(dt);ctx=worldCtx;draw();ctx=screenCtx;const cameraX=Math.max(0,Math.min(W-VIEW_W,player.x*T-VIEW_W/2));screenCtx.clearRect(0,0,360,640);screenCtx.imageSmoothingEnabled=false;screenCtx.drawImage(worldCanvas,Math.round(cameraX),0,VIEW_W,VIEW_H,0,0,360,640);requestAnimationFrame(loop)}function say(who,body,opts=[['繼續',closeDialog]]){dialog=true;$('dialog').style.display='block';$('speaker').textContent=who;$('speech').textContent=body;$('choices').replaceChildren();opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('choices').appendChild(b)})}function closeDialog(){dialog=false;$('dialog').style.display='none'}function show(html){modal=true;$('panel').innerHTML=html;$('modal').classList.remove('hidden')}function hide(){modal=false;$('modal').classList.add('hidden')}function interact(){if(modal||dialog)return;let m=maps[room],near=m.npcs.filter(n=>Math.hypot(player.x-(n.x+.5),player.y-(n.y+.5))<2).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];if(near){talk(near.type);return}let it=(m.items||[]).find(n=>Math.hypot(player.x-(n.x+.5),player.y-(n.y+.5))<1.7);if(it){if(room==='safety'){if(!found.has(it.id)){found.add(it.id);say('發現缺失',it.hint+'。已記錄 '+found.size+'/3 處。', [['確認',()=>{closeDialog();if(found.size===3&&!finished.safety){finished.safety=true;scores.safety=100;say('職安學長','全部找到了！安全觀察力滿分，獲得職安徽章。')}}]])}else say('巡查紀錄','這個問題你已經發現過了。')}else if(room==='plan'){planFound.add(it.id);say('圖面比對',it.hint+'。已比對 '+planFound.size+'/3 張。',[['確認',()=>{closeDialog();if(planFound.size===3&&!finished.plan){finished.plan=true;scores.plan=100;say('規劃工程師','三處差異都找到了！獲得規劃徽章。')}}]])}return}say('冒險提示','靠近有名字的 NPC 或「!」標記，按互動鍵。')}
function talk(type){if(type==='cat'){cat=true;say('橘色總監','喵！你獲得了隱藏成就：橘貓的認可。');return}if(type==='hr'){if(Object.values(finished).every(Boolean)){showResult();return}say('HR 學姊',`歡迎你，${profile.name}！四個區域的學長姐都在等你。你已完成 ${Object.values(finished).filter(Boolean).length} 個任務，全部完成後記得回來找我！`);return}if(type==='safety'){say('職安學長',finished.safety?'你已完成巡查任務！':'這個區域有三處安全缺失。走近「!」標記仔細觀察，找到所有問題。');return}if(type==='build'){if(finished.build){say('施工學長','工序挑戰完成，辛苦啦！');return}closeDialog();order=[];buildTask();return}if(type==='quality'){if(finished.quality){say('品管學姊','品質挑戰完成！');return}closeDialog();question=0;qualityTask();return}if(type==='plan'){say('規劃工程師',finished.plan?'你已完成圖面比對！':'三張圖面有不同的問題，靠近桌上的「!」標記找出差異。');return}}
function buildTask(){const steps=['確認圖說與作業條件','檢查作業區及安全措施','確認材料、人員與機具','依核定計畫施工及檢查'];let options=[2,0,3,1].filter(n=>!order.includes(n));show(`<h2>🏗️ 施工組｜工序挑戰</h2><p>依照這個教學情境，選出合理的施工準備順序。</p><p class="hint">已選：${order.map(i=>steps[i]).join(' → ')||'尚未選擇'}</p><div id="taskOptions"></div><button class="full" id="backTask">離開任務</button>`);options.forEach(i=>{let b=document.createElement('button');b.className='full';b.textContent=steps[i];b.onclick=()=>{order.push(i);if(order.length===4){let right=order.every((v,j)=>v===j);scores.build=right?100:70;finished.build=true;show(`<h2>${right?'🎉 順序正確！':'🎉 任務完成！'}</h2><p>${right?'你掌握了這次任務的安排邏輯。':'參考順序：'+steps.join(' → ')}</p><p>施工組得分：${scores.build}</p><button class="full" id="done">返回工地</button>`);$('done').onclick=hide}else buildTask()};$('taskOptions').appendChild(b)});$('backTask').onclick=hide}
const qs=[{q:'材料已到場，但檢驗文件尚未確認，應如何處理？',a:['先使用再補件','確認文件及材料符合要求後依程序使用','外觀正常即可'],ok:1},{q:'現場檢查發現紀錄與實際狀況不一致，應該？',a:['依程序回報並釐清','先忽略','直接修改紀錄使其一致'],ok:0},{q:'發現疑似不符合規範的材料時，較合適的做法？',a:['直接混用','先放一邊不記錄','依程序標示、通報及確認處置'],ok:2}];let qualityPoints=0;function qualityTask(){let q=qs[question];show(`<h2>📋 品管組｜品質判斷</h2><p>第 ${question+1}/3 題：${q.q}</p><div id="answers"></div><button class="full" id="quit">離開任務</button>`);q.a.forEach((s,i)=>{let b=document.createElement('button');b.className='full';b.textContent=s;b.onclick=()=>{if(i===q.ok)qualityPoints++;question++;if(question<qs.length)qualityTask();else{finished.quality=true;scores.quality=Math.round(qualityPoints/3*100);show(`<h2>🎉 品管任務完成</h2><p>答對 ${qualityPoints}/3 題，得分 ${scores.quality}。</p><p>品質判斷需要依照程序與文件確認。</p><button class="full" id="done">返回探索</button>`);$('done').onclick=hide;qualityPoints=0}};$('answers').appendChild(b)});$('quit').onclick=()=>{qualityPoints=0;hide()}}
function showResult(){let labels={safety:'職安組',build:'施工組',quality:'品管組',plan:'規劃組'},entries=Object.entries(scores).sort((a,b)=>b[1]-a[1]),top=entries.filter(e=>e[1]===entries[0][1]).map(e=>labels[e[0]]).join('、');show(`<h2>🏆 冒險完成！</h2><p>${profile.name}，你完成了四組專業任務！</p><div class="scores">${entries.map(([k,v])=>`<span>${labels[k]}</span><span class="score">${v}/100</span>`).join('')}</div><h2>最高得分：${top}</h2><p>${cat?'🐈 已獲得橘色總監認可！':''}</p><p class="hint">這是遊戲任務表現，不代表正式職涯能力評估。</p><button class="full" id="restart">再玩一次</button>`);$('restart').onclick=()=>location.reload()}
function journal(){let labels={safety:'🦺 職安巡查',build:'🏗️ 施工流程',quality:'📋 品質判斷',plan:'📐 圖面解謎'};show(`<h2>📖 實習冒險手冊</h2><p>自由探索五個場景，完成四組任務。</p><div class="scores">${Object.keys(labels).map(k=>`<span>${labels[k]}</span><span>${finished[k]?'✓ '+scores[k]+' 分':'尚未完成'}</span>`).join('')}</div><p>${cat?'🐈 橘色總監：已發現':'🐈 還有一隻神秘橘貓……'}</p><p class="hint">電腦：WASD／方向鍵移動，空白鍵或 E 互動。手機：方向鍵與互動按鈕。</p><button class="full" id="resume">繼續冒險</button>`);$('resume').onclick=hide}
function start(){show(`<h1>THE FIRST CHAPTER II</h1><p>工地冒險日誌｜創建你的角色</p><div class="preview"><canvas id="avatar" width="150" height="150"></canvas></div><div class="field"><label>冒險者暱稱</label><input id="nickname" maxlength="16" placeholder="輸入暱稱" value="冒險者"></div><div class="row">${[['style','髮型',[['short','短髮'],['long','長髮'],['pony','馬尾']]],['hair','髮色',[['brown','棕色'],['black','黑色'],['blond','金色'],['pink','粉色']]],['skin','膚色',[['peach','自然'],['light','淺色'],['tan','小麥'],['brown','深色']]],['shirt','上衣',[['teal','青色帽T'],['red','紅色外套'],['yellow','黃色T恤'],['purple','紫色上衣'],['white','白色襯衫']]],['pants','下身',[['navy','藍色長褲'],['black','黑色長褲'],['khaki','卡其長褲']]]].map(([key,label,values])=>`<div class="field"><label>${label}</label><select data-custom="${key}">${values.map(([v,l])=>`<option value="${v}" ${profile[key]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div><button class="full" id="begin">開始第一天的冒險 →</button><p class="hint">本原型使用程式繪製的統一像素素材，可在手機和電腦直接遊玩。</p>`);const preview=()=>{let c=$('avatar'),c2=c.getContext('2d');c2.imageSmoothingEnabled=false;c2.clearRect(0,0,150,150);let old=ctx;ctx=c2;char(75,91,profile,2.5,0);ctx=old};$('panel').querySelectorAll('[data-custom]').forEach(e=>e.onchange=()=>{profile[e.dataset.custom]=e.value;preview()});preview();$('begin').onclick=()=>{profile.name=$('nickname').value.trim()||'冒險者';hide();say('HR 學姊',`歡迎來到豐譽，${profile.name}！今天先到各個區域找學長姐完成挑戰吧。靠近門口的黃色箭頭可以切換場景。`)}}
$('journal').onclick=journal;$('action').onclick=interact;document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;const release=e=>{held.delete(dir);e.preventDefault()};b.addEventListener('pointerdown',e=>{held.add(dir);b.setPointerCapture(e.pointerId);e.preventDefault()});b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>held.delete(dir))});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(modal)return;if(dialog){if(e.key==='Enter'||e.key===' '){const b=$('choices').querySelector('button');if(b)b.click()}return}const key={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key.toLowerCase();if(['up','down','left','right','w','a','s','d'].includes(key))held.add(key);if(e.key===' '||e.key.toLowerCase()==='e')interact()});window.addEventListener('keyup',e=>{held.delete(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key.toLowerCase()))});start();requestAnimationFrame(loop)})();
</script></body></html>
