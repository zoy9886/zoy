<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>豐譽實習冒險｜素材整合測試版</title><style>*{box-sizing:border-box}body{margin:0;background:#14252c;color:#e9f1ed;font-family:system-ui,'Noto Sans TC',sans-serif}#app{max-width:1080px;height:100dvh;margin:auto;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1d3942;padding:8px 12px;font-size:14px}header b{color:#f0d99a}button{font:inherit;cursor:pointer;background:#d7bb73;color:#213943;border:1px solid #e6d8aa;border-radius:8px;padding:9px;font-weight:700}#view{position:relative;flex:1;min-height:0;background:#243b40;overflow:hidden}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;touch-action:none}#stats{position:absolute;top:10px;left:10px;background:#17313ddf;padding:8px 11px;border-radius:8px;font-size:12px;pointer-events:none}#notice{position:absolute;top:10px;right:10px;background:#17313ddf;padding:7px 10px;border-radius:8px;font-size:12px;max-width:45%}#pad{position:absolute;bottom:12px;left:12px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:4px}#pad button{background:#1c3945d9;color:white;padding:0;font-size:22px;touch-action:none}#pad [data-dir=up]{grid-column:2}#pad [data-dir=left]{grid-column:1;grid-row:2}#pad [data-dir=down]{grid-column:2;grid-row:2}#pad [data-dir=right]{grid-column:3;grid-row:2}#act{position:absolute;right:12px;bottom:16px;width:72px;height:72px;border-radius:50%}#dialog{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);width:min(94%,620px);padding:15px;background:#16323aee;border:2px solid #e0bf70;border-radius:12px;display:none;z-index:4;line-height:1.7;box-shadow:0 8px 20px #10242caa}#dialog strong{color:#f2d48a}#choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}#choices button{font-size:13px}footer{background:#1d3942;display:flex;gap:7px;padding:7px;justify-content:center;flex-wrap:wrap}footer button{padding:6px 11px;font-size:12px}#inventory{display:none;position:absolute;inset:8%;background:#1b3740f7;border:2px solid #d7bb73;border-radius:12px;padding:16px;overflow:auto;z-index:5}#inventory h3{margin:0 0 12px}#inventory .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}#inventory .tile{background:#284b55;padding:8px;border-radius:7px;text-align:center;font-size:11px;word-break:break-all}#inventory img{width:64px;height:64px;image-rendering:pixelated;display:block;margin:auto}#inventory .close{float:right}#toast{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#1b343deb;border:1px solid #e2c57e;border-radius:7px;padding:7px 10px;display:none;z-index:4;font-size:12px}@media(max-width:500px){header{font-size:12px}#pad{bottom:8px;left:8px;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}#act{width:62px;height:62px;font-size:13px}footer button{font-size:11px;padding:6px}}
</style></head><body><div id="app"><header><b>豐譽｜實習探索 RPG</b><span id="area">施工組</span><span id="progress">任務 0/4</span></header><div id="view"><canvas id="game" width="960" height="640"></canvas><div id="stats">方向鍵／WASD 移動<br>E／空白鍵 互動</div><div id="notice">真正使用 268 個 PNG 素材庫的模組化場景</div><div id="toast"></div><div id="dialog"><strong id="speaker"></strong><div id="speech"></div><div id="choices"></div></div><div id="pad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button id="act">互動</button><div id="inventory"><button class="close" id="close">關閉</button><h3>素材庫與任務日誌</h3><div id="journal"></div><h4>已載入素材預覽</h4><div class="grid" id="gallery"></div></div></div><footer><button data-room="build">施工組</button><button data-room="safety">職安組</button><button data-room="quality">品管組</button><button data-room="plan">規劃組</button><button id="bag">素材／日誌</button><button id="reset">重設進度</button></footer></div><script src="js/game.js"></script></body></html>
