<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豐譽實習探索</title><style>body{margin:0;background:#172d33;color:#fff;font-family:system-ui}main{max-width:440px;margin:auto;height:100dvh;position:relative}canvas{width:100%;height:100%;image-rendering:pixelated}#panel{position:absolute;bottom:120px;left:8px;right:8px;background:#183740;border:2px solid #dec28b;border-radius:12px;padding:12px;display:none}button{padding:10px;background:#315f66;color:white;border:2px solid #ddc48a;border-radius:9px}#pad{position:absolute;bottom:10px;left:10px;display:grid;grid-template-columns:repeat(3,50px);gap:3px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#pad button:nth-child(3){grid-column:2}#pad button:nth-child(4){grid-column:3}#act{position:absolute;right:10px;bottom:15px;height:65px}#hud{position:absolute;top:10px;left:10px;background:#17383edc;padding:8px}</style><main><canvas id="game" width="360" height="640"></canvas><div id="hud"></div><div id="panel"><b id="speaker"></b><p id="message"></p><div id="choices"></div></div><div id="pad"><button data-d="0,-1">▲</button><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div><button id="act">互動</button></main><script>
const c=document.querySelector('#game').getContext('2d');c.imageSmoothingEnabled=false;let room='hr',px=5,py=12,dialog=false,time=0;const names={hr:'HR室',plan:'規劃室',build:'施工組',safety:'職安組',quality:'品管組'},started={plan:false,build:false,safety:false,quality:false},done={plan:false,build:false,safety:false,quality:false},found={plan:new Set(),safety:new Set()},doors={hr:[[5,1,'plan'],[10,11,'build']],plan:[[5,15,'hr']],build:[[1,12,'hr'],[10,7,'safety'],[6,15,'quality']],safety:[[1,12,'build']],quality:[[5,1,'build']]},items={plan:[[3,9,'圖面A'],[7,10,'圖面B'],[8,8,'圖面C']],safety:[[3,10,'三角錐'],[8,11,'護欄'],[7,8,'安全帽']]};function r(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function text(t,x,y,size=12){c.font='bold '+size+'px sans-serif';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#1e3539';c.strokeText(t,x,y);c.fillStyle='#fff1ce';c.fillText(t,x,y)}function npc(x,y,color,hat){r(x-8,y-14,16,16,'#edc09c');r(x-9,y-18,18,6,hat?'#e8bf5d':'#403e42');r(x-11,y+3,22,22,color);r(x-8,y+25,7,12,'#45606a');r(x+1,y+25,7,12,'#45606a')}
function draw(){time+=.03;let office=room==='hr'||room==='plan';r(0,0,360,640,office?'#b3c7bb':'#b3a58b');for(let y=0;y<640;y+=30)for(let x=0;x<360;x+=30){r(x,y,29,29,office?(x+y)%60?'#b9cabe':'#aabfb4':(x+y)%60?'#bcad93':'#ad9e85');r(x+4,y+4,3,3,office?'#d1ded1':'#d2bfa3')}r(0,0,360,35,'#607c78');r(0,605,360,35,'#667974');r(0,0,20,640,'#66837c');r(340,0,20,640,'#66837c');if(office){for(let i=0;i<3;i++){r(40+i*100,50,80,45,'#648d91');r(44+i*100,54,72,37,'#a5c8c9');r(42+i*100,140,80,40,'#a88762');r(49+i*100,145,27,20,'#4c707d');r(54+i*100,149,17,12,'#a4c5c7');r(84+i*100,146,27,18,'#dfe6dc')}for(let i=0;i<3;i++){r(45+i*100,440,76,65,'#6b8987');for(let j=0;j<3;j++){r(49+i*100,450+j*17,68,4,'#d3b58a');r(55+i*100,455+j*17,12,9,'#b3a17e')}}text(room==='hr'?'新人報到／HR接待':'圖面協調／BIM',180,285,16)}else{for(let i=0;i<7;i++){r(35+i*44,55,7,120,'#849b9b');r(35+i*44,84,40,4,'#c7d1c7')}for(let i=0;i<5;i++){r(45+i*56,405,45,60,'#b28a5e');r(50+i*56,410,35,50,'#d0a670')}if(room==='safety')for(let i=0;i<5;i++){r(45+i*52,330,8,62,'#d8a64b');r(45+i*52,339,48,8,'#e5c477')}if(room==='quality')for(let i=0;i<4;i++){r(35+i*78,328,70,52,'#718e95');r(40+i*78,334,60,40,'#dbe1d5')}text(room==='build'?'鋼筋／模板／材料':room==='safety'?'安全護欄／巡查':'材料檢驗／紀錄',180,285,16)}for(let [x,y,to] of doors[room]){r(x*30,y*30,30,30,'#e9c67b');text('↗',x*30+15,y*30+23,21);text(names[to],x*30+15,y*30+44,10)}for(let [x,y,id] of items[room]||[]){r(x*30+4,y*30+5,22,23,room==='safety'?'#e0ac58':'#dbe4dd');if(started[room])text(found[room].has(id)?'✓':'!',x*30+15,y*30-5,20)}for(let i=0;i<5;i++){let x=50+i%3*110,y=355+Math.floor(i/3)*130;npc(x,y,'#799996',!office);text(['工程師','實習生','技術人員','同仁','助理'][i],x,y-25,10)}npc(165,195,room==='hr'?'#9a7ca0':'#719b9a',!office);text(room==='hr'?'HR學姊':({plan:'規劃工程師',build:'施工學長',safety:'職安學長',quality:'品管學姊'}[room]),165,165,12);if(room!=='hr'){let bob=Math.sin(time*4)*3;c.beginPath();c.moveTo(154,143+bob);c.lineTo(176,143+bob);c.lineTo(165,162+bob);c.closePath();c.fillStyle='#ff3445';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke()}npc(px*30+15,py*30+14,'#3c9593',false);text('你',px*30+15,py*30-8,11);document.querySelector('#hud').textContent=names[room]+'｜徽章 '+Object.values(done).filter(Boolean).length+'/4';requestAnimationFrame(draw)}function show(w,m,options=[['繼續',close]]){dialog=true;document.querySelector('#panel').style.display='block';document.querySelector('#speaker').textContent=w;document.querySelector('#message').textContent=m;let el=document.querySelector('#choices');el.replaceChildren();for(let [s,fn] of options){let b=document.createElement('button');b.textContent=s;b.onclick=fn;el.append(b)}}function close(){dialog=false;document.querySelector('#panel').style.display='none'}function move(dx,dy){if(dialog)return;px=Math.max(1,Math.min(10,px+dx));py=Math.max(1,Math.min(15,py+dy));for(let [x,y,to] of doors[room])if(Math.hypot(px-x,py-y)<1.1){room=to;px=5;py=to==='plan'?13:to==='quality'?3:11;show('場景切換','已抵達'+names[room]);return}}function quiz(type,i=0){if(i===3){done[type]=true;show('任務完成','恭喜取得'+names[type]+'徽章！');return}let qs=type==='build'?['施工前先確認圖說嗎？','進場前需要確認安全措施嗎？','材料進場需要核對規格嗎？']:['檢驗時要確認材料規格嗎？','檢驗紀錄需要留存嗎？','異常應依程序處理嗎？'];show(names[type]+' 第'+(i+1)+'題',qs[i],[['是',()=>quiz(type,i+1)],['否',()=>quiz(type,i+1)]])}function interact(){if(dialog)return;if(Math.hypot(px-5,py-6)<2.3){if(room==='hr')return show('HR學姊','請前往規劃室及現場施工區，尋找四位頭上有紅色倒三角的任務角色。');if(done[room])return show('任務學長姐','你已完成本組任務！');if(room==='plan'||room==='safety')return show(room==='plan'?'規劃工程師':'職安學長','請協助調查三個工作項目。接受任務後，場景才會出現驚嘆號。',[['接受任務',()=>{started[room]=true;show('任務開始','調查點已解鎖！')}],['稍後',close]]);return show(room==='build'?'施工學長':'品管學姊','先了解工作內容，再開始挑戰。',[['開始挑戰',()=>{started[room]=true;quiz(room)}],['稍後',close]])}for(let [x,y,id] of items[room]||[])if(Math.hypot(px-x,py-y)<2){if(!started[room])return show('任務尚未開始','請先和任務 NPC 對話。');found[room].add(id);if(found[room].size===3)done[room]=true;return show('調查紀錄',id+' 已記錄。'+(done[room]?'恭喜獲得徽章！':'已完成 '+found[room].size+'/3 處。'))}show('探索提示','靠近紅色倒三角的任務角色或黃色出口。')}document.querySelectorAll('[data-d]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();move(...b.dataset.d.split(',').map(Number))});document.querySelector('#act').onclick=interact;onkeydown=e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}if(e.key===' '||e.key==='Enter'){e.preventDefault();interact()}};draw();show('歡迎','此版本包含五個場景。只有四位任務角色有紅色倒三角，接受任務後才會顯示驚嘆號。');
</script></html>
