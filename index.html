function blocked(x,y){if(x<.75||x>19.25||y<.75||y>14.25)return true;return maps[room].obstacles.some(([a,b,c,d])=>x>a-.25&&x<c+.2&&y>b-.45&&y<d+.2)}function update(dt){if(modal||dialog)return;let dx=0,dy=0;if(held.has('left')||held.has('a'))dx--;if(held.has('right')||held.has('d'))dx++;if(held.has('up')||held.has('w'))dy--;if(held.has('down')||held.has('s'))dy++;if(dx||dy){let len=Math.hypot(dx,dy),v=Math.min(dt,.04)*3.2;dx=dx/len*v;dy=dy/len*v;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;player.walk+=dt*13;player.dir=Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up'}maps[room].doors.forEach(d=>{if(Math.hypot(player.x-(d.x+.5),player.y-(d.y+.5))<.9){room=d.to;player.x=d.tx;player.y=d.ty;held.clear();$('status').textContent=maps[room].name}})}function loop(now){let dt=last?(now-last)/1000:0;last=now;update(dt);ctx=worldCtx;draw();ctx=screenCtx;const cameraX=Math.max(0,Math.min(W-VIEW_W,player.x*T-VIEW_W/2));screenCtx.clearRect(0,0,360,640);screenCtx.imageSmoothingEnabled=false;screenCtx.drawImage(worldCanvas,Math.round(cameraX),0,VIEW_W,VIEW_H,0,0,360,640);requestAnimationFrame(loop)}function say(who,body,opts=[['繼續',closeDialog]]){dialog=true;$('dialog').style.display='block';$('speaker').textContent=who;$('speech').textContent=body;$('choices').replaceChildren();opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('choices').appendChild(b)})}function closeDialog(){dialog=false;$('dialog').style.display='none'}function show(html){modal=true;$('panel').innerHTML=html;$('modal').classList.remove('hidden')}function hide(){modal=false;$('modal').classList.add('hidden')}function interact(){if(modal||dialog)return;let m=maps[room],near=m.npcs.filter(n=>Math.hypot(player.x-(n.x+.5),player.y-(n.y+.5))<2).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];if(near){talk(near.type);return}let coworker=extraCrew().filter(n=>Math.hypot(player.x-(n.x+.5),player.y-(n.y+.5))<1.8).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];if(coworker){say(coworker.label,coworker.speech);return}let it=(m.items||[]).find(n=>Math.hypot(player.x-(n.x+.5),player.y-(n.y+.5))<1.7);if(it){if(room==='safety'){if(!found.has(it.id)){found.add(it.id);say('發現缺失',it.hint+'。已記錄 '+found.size+'/3 處。', [['確認',()=>{closeDialog();if(found.size===3&&!finished.safety){finished.safety=true;scores.safety=100;say('職安學長','全部找到了！安全觀察力滿分，獲得職安徽章。')}}]])}else say('巡查紀錄','這個問題你已經發現過了。')}else if(room==='plan'){planFound.add(it.id);say('圖面比對',it.hint+'。已比對 '+planFound.size+'/3 張。',[['確認',()=>{closeDialog();if(planFound.size===3&&!finished.plan){finished.plan=true;scores.plan=100;say('規劃工程師','三處差異都找到了！獲得規劃徽章。')}}]])}return}say('冒險提示','靠近有名字的 NPC 或「!」標記，按互動鍵。')}
function talk(type){if(type==='cat'){cat=true;say('橘色總監','喵！你獲得了隱藏成就：橘貓的認可。');return}if(type==='hr'){if(Object.values(finished).every(Boolean)){showResult();return}say('HR 學姊',`歡迎你，${profile.name}！先從辦公區前往規劃室，再到現場施工區找施工、職安與品管學長姐。你已完成 ${Object.values(finished).filter(Boolean).length} 個任務，全部完成後記得回來找我！`);return}if(type==='safety'){say('職安學長',finished.safety?'你已完成巡查任務！':'這個區域有三處安全缺失。走近「!」標記仔細觀察，找到所有問題。');return}if(type==='build'){if(finished.build){say('施工學長','工序挑戰完成，辛苦啦！');return}closeDialog();order=[];buildTask();return}if(type==='quality'){if(finished.quality){say('品管學姊','品質挑戰完成！');return}closeDialog();question=0;qualityTask();return}if(type==='plan'){say('規劃工程師',finished.plan?'你已完成圖面比對！':'三張圖面有不同的問題，靠近桌上的「!」標記找出差異。');return}}
function buildTask(){const steps=['確認圖說與作業條件','檢查作業區及安全措施','確認材料、人員與機具','依核定計畫施工及檢查'];let options=[2,0,3,1].filter(n=>!order.includes(n));show(`<h2>🏗️ 施工組｜工序挑戰</h2><p>依照這個教學情境，選出合理的施工準備順序。</p><p class="hint">已選：${order.map(i=>steps[i]).join(' → ')||'尚未選擇'}</p><div id="taskOptions"></div><button class="full" id="backTask">離開任務</button>`);options.forEach(i=>{let b=document.createElement('button');b.className='full';b.textContent=steps[i];b.onclick=()=>{order.push(i);if(order.length===4){let right=order.every((v,j)=>v===j);scores.build=right?100:70;finished.build=true;show(`<h2>${right?'🎉 順序正確！':'🎉 任務完成！'}</h2><p>${right?'你掌握了這次任務的安排邏輯。':'參考順序：'+steps.join(' → ')}</p><p>施工組得分：${scores.build}</p><button class="full" id="done">返回工地</button>`);$('done').onclick=hide}else buildTask()};$('taskOptions').appendChild(b)});$('backTask').onclick=hide}
const qs=[{q:'材料已到場，但檢驗文件尚未確認，應如何處理？',a:['先使用再補件','確認文件及材料符合要求後依程序使用','外觀正常即可'],ok:1},{q:'現場檢查發現紀錄與實際狀況不一致，應該？',a:['依程序回報並釐清','先忽略','直接修改紀錄使其一致'],ok:0},{q:'發現疑似不符合規範的材料時，較合適的做法？',a:['直接混用','先放一邊不記錄','依程序標示、通報及確認處置'],ok:2}];let qualityPoints=0;function qualityTask(){let q=qs[question];show(`<h2>📋 品管組｜品質判斷</h2><p>第 ${question+1}/3 題：${q.q}</p><div id="answers"></div><button class="full" id="quit">離開任務</button>`);q.a.forEach((s,i)=>{let b=document.createElement('button');b.className='full';b.textContent=s;b.onclick=()=>{if(i===q.ok)qualityPoints++;question++;if(question<qs.length)qualityTask();else{finished.quality=true;scores.quality=Math.round(qualityPoints/3*100);show(`<h2>🎉 品管任務完成</h2><p>答對 ${qualityPoints}/3 題，得分 ${scores.quality}。</p><p>品質判斷需要依照程序與文件確認。</p><button class="full" id="done">返回探索</button>`);$('done').onclick=hide;qualityPoints=0}};$('answers').appendChild(b)});$('quit').onclick=()=>{qualityPoints=0;hide()}}
function showResult(){let labels={safety:'職安組',build:'施工組',quality:'品管組',plan:'規劃組'},entries=Object.entries(scores).sort((a,b)=>b[1]-a[1]),top=entries.filter(e=>e[1]===entries[0][1]).map(e=>labels[e[0]]).join('、');show(`<h2>🏆 冒險完成！</h2><p>${profile.name}，你完成了四組專業任務！</p><div class="scores">${entries.map(([k,v])=>`<span>${labels[k]}</span><span class="score">${v}/100</span>`).join('')}</div><h2>最高得分：${top}</h2><p>${cat?'🐈 已獲得橘色總監認可！':''}</p><p class="hint">這是遊戲任務表現，不代表正式職涯能力評估。</p><button class="full" id="restart">再玩一次</button>`);$('restart').onclick=()=>location.reload()}
function journal(){let labels={safety:'🦺 職安巡查',build:'🏗️ 施工流程',quality:'📋 品質判斷',plan:'📐 圖面解謎'};show(`<h2>📖 實習冒險手冊</h2><p>探索兩大區域：辦公區（HR、規劃）與現場施工區（施工、職安、品管），完成四組任務。</p><div class="scores">${Object.keys(labels).map(k=>`<span>${labels[k]}</span><span>${finished[k]?'✓ '+scores[k]+' 分':'尚未完成'}</span>`).join('')}</div><p>${cat?'🐈 橘色總監：已發現':'🐈 還有一隻神秘橘貓……'}</p><p class="hint">電腦：WASD／方向鍵移動，空白鍵或 E 互動。手機：方向鍵與互動按鈕。</p><button class="full" id="resume">繼續冒險</button>`);$('resume').onclick=hide}
function start(){show(`<h1>THE FIRST CHAPTER II</h1><p>工地冒險日誌｜創建你的角色</p><div class="preview"><canvas id="avatar" width="150" height="150"></canvas></div><div class="field"><label>冒險者暱稱</label><input id="nickname" maxlength="16" placeholder="輸入暱稱" value="冒險者"></div><div class="row">${[['style','髮型',[['short','短髮'],['long','長髮'],['pony','馬尾']]],['hair','髮色',[['brown','棕色'],['black','黑色'],['blond','金色'],['pink','粉色']]],['skin','膚色',[['peach','自然'],['light','淺色'],['tan','小麥'],['brown','深色']]],['shirt','上衣',[['teal','青色帽T'],['red','紅色外套'],['yellow','黃色T恤'],['purple','紫色上衣'],['white','白色襯衫']]],['pants','下身',[['navy','藍色長褲'],['black','黑色長褲'],['khaki','卡其長褲']]]].map(([key,label,values])=>`<div class="field"><label>${label}</label><select data-custom="${key}">${values.map(([v,l])=>`<option value="${v}" ${profile[key]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div><button class="full" id="begin">開始第一天的冒險 →</button><p class="hint">本原型使用程式繪製的統一像素素材，可在手機和電腦直接遊玩。</p>`);const preview=()=>{let c=$('avatar'),c2=c.getContext('2d');c2.imageSmoothingEnabled=false;c2.clearRect(0,0,150,150);let old=ctx;ctx=c2;char(75,91,profile,2.5,0);ctx=old};$('panel').querySelectorAll('[data-custom]').forEach(e=>e.onchange=()=>{profile[e.dataset.custom]=e.value;preview()});preview();$('begin').onclick=()=>{profile.name=$('nickname').value.trim()||'冒險者';hide();say('HR 學姊',`歡迎來到豐譽，${profile.name}！今天先到各個區域找學長姐完成挑戰吧。辦公區與現場施工區可透過黃色門口切換；角色頭上的紅色倒三角代表可以互動。`)}}
$('journal').onclick=journal;$('action').onclick=interact;document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;const release=e=>{held.delete(dir);e.preventDefault()};b.addEventListener('pointerdown',e=>{held.add(dir);b.setPointerCapture(e.pointerId);e.preventDefault()});b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>held.delete(dir))});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(modal)return;if(dialog){if(e.key==='Enter'||e.key===' '){const b=$('choices').querySelector('button');if(b)b.click()}return}const key={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key.toLowerCase();if(['up','down','left','right','w','a','s','d'].includes(key))held.add(key);if(e.key===' '||e.key.toLowerCase()==='e')interact()});window.addEventListener('keyup',e=>{held.delete(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key.toLowerCase()))});start();requestAnimationFrame(loop)})();
