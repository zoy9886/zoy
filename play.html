<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>施工現場｜素材包測試</title><style>*{box-sizing:border-box}html,body{margin:0;background:#182c35;color:#e9f2ed;font-family:system-ui;height:100%;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column;align-items:center}header{height:44px;width:100%;display:flex;justify-content:center;align-items:center;font-size:13px;background:#203b45}#stage{position:relative;flex:1;min-height:0;width:min(100%,calc((100dvh - 44px)*9/16));background:#92a9a5}canvas{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}#pad{position:absolute;bottom:18px;left:14px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;touch-action:none}button{border:2px solid #d8e9d7;background:#254d5cdd;color:#fff;border-radius:13px;font-size:21px;touch-action:none;user-select:none}#action{position:absolute;right:17px;bottom:45px;width:72px;height:72px;border-radius:50%;font-size:15px;background:#be8643}#info{position:absolute;left:8px;top:8px;right:8px;padding:7px;background:#172d36b8;border-radius:6px;font-size:11px;pointer-events:none}#toast{position:absolute;left:12px;right:12px;bottom:185px;background:#233e48ec;padding:10px;border:2px solid #d8d6b1;display:none;font-size:13px} @media(min-width:700px){#stage{box-shadow:0 0 0 1px #8ba5a0}}</style></head><body><div id="app"><header>施工現場｜2D RPG 素材包・手機操作測試</header><div id="stage"><canvas id="c" width="360" height="640"></canvas><div id="info">方向鍵 / WASD 移動 · 地圖跟隨 · 物件碰撞 · 前後遮擋</div><div id="toast"></div><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="action">互動</button></div></div><script>
const cv=document.querySelector('#c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;let map=null,tiles=null,playerSheet=null,images={};let player={x:384,y:1024,dir:0,step:0};const keys=new Set();const dirs={up:[0,-1,3],down:[0,1,0],left:[-1,0,1],right:[1,0,2]};function load(src){return new Promise((ok,fail)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=()=>fail(src);i.src=src})}async function init(){try{map=await (await fetch('construction_map.json')).json();tiles=await load(map.tileset);playerSheet=await load('assets/characters/worker_4dir_4frames.png');for(const name of new Set(map.objects.map(o=>o.sprite)))images[name]=await load('assets/props/'+name+'.png');player.x=map.spawn.x;player.y=map.spawn.y;requestAnimationFrame(loop)}catch(e){document.querySelector('#info').textContent='讀取失敗：請透過本機 HTTP 伺服器開啟（參考 README），不要直接用 file:// 開啟。 '+e}}function collision(x,y){let r={x:x-8,y:y+8,w:16,h:12};if(r.x<0||r.y<0||r.x+r.w>map.width*32||r.y+r.h>map.height*32)return true;return map.objects.some(o=>{let [a,b,w,h]=o.collision;return r.x<o.x+a+w&&r.x+r.w>o.x+a&&r.y<o.y+b+h&&r.y+r.h>o.y+b})}let last=0;function loop(now){let dt=Math.min((now-last)/1000,.04)||0;last=now;let dx=0,dy=0;for(const key of keys){let d=dirs[key];if(d){dx+=d[0];dy+=d[1];player.dir=d[2]}}if(dx||dy){let len=Math.hypot(dx,dy);dx/=len;dy/=len;let speed=120*dt;if(!collision(player.x+dx*speed,player.y))player.x+=dx*speed;if(!collision(player.x,player.y+dy*speed))player.y+=dy*speed;player.step+=dt*9}else player.step=0;draw();requestAnimationFrame(loop)}function draw(){ctx.clearRect(0,0,360,640);const camX=Math.max(0,Math.min(map.width*32-360,player.x-180)),camY=Math.max(0,Math.min(map.height*32-640,player.y-350));ctx.save();ctx.translate(-Math.round(camX),-Math.round(camY));let tx0=Math.floor(camX/32),ty0=Math.floor(camY/32);for(let y=ty0;y<=Math.min(map.height-1,ty0+21);y++)for(let x=tx0;x<=Math.min(map.width-1,tx0+12);x++){let t=map.terrain[y][x];ctx.drawImage(tiles,t%8*32,Math.floor(t/8)*32,32,32,x*32,y*32,32,32)}let elements=map.objects.map(o=>({y:o.y+o.collision[1]+o.collision[3],o}));elements.push({y:player.y+20,player:true});elements.sort((a,b)=>a.y-b.y);for(const e of elements){if(e.player){let f=Math.floor(player.step)%4;ctx.drawImage(playerSheet,f*32,player.dir*48,32,48,Math.round(player.x)-16,Math.round(player.y)-28,32,48)}else{let o=e.o;ctx.drawImage(images[o.sprite],o.x,o.y,o.w,o.h)}}ctx.restore()}const pad=document.querySelector('#pad');pad.querySelectorAll('button').forEach(b=>{let k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(k))});const aliases={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};addEventListener('keydown',e=>{if(aliases[e.key]){keys.add(aliases[e.key]);e.preventDefault()}});addEventListener('keyup',e=>{if(aliases[e.key])keys.delete(aliases[e.key])});document.querySelector('#action').onclick=()=>{let near=map.objects.filter(o=>Math.hypot(player.x-(o.x+o.w/2),player.y-(o.y+o.h*.8))<125).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];let toast=document.querySelector('#toast');toast.textContent=near?'你正在查看：'+near.sprite+'（可在此串接任務與對話）':'靠近工地物件後，再按互動。';toast.style.display='block';setTimeout(()=>toast.style.display='none',2500)};init();
</script></body></html>
